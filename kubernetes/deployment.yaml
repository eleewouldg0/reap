apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  labels:
    app: python-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          image: upwind-demo/python-service:latest
          ports:
            - containerPort: 5000
          # DEMO-FINDING: privileged container, running as root, no resource
          # limits, no readiness/liveness probes — classic K8s IaC findings.
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          # no resources: block on purpose (DEMO-FINDING)
