name: Container Scan

on:
  workflow_run:
    workflows: ["Build and Push Images (GHCR)"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-scan-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Runs after build-and-push.yml has published the image to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-python-service" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy vulnerability scan (GHCR image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ steps.image.outputs.name }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      # Placeholder for Upwind's runtime/container-native scanning integration
      - name: Upwind container scan (placeholder)
        run: |
          echo "Wire in Upwind's image-scanning step here, e.g.:"
          echo "upwindctl image scan ${{ steps.image.outputs.name }}:${{ github.sha }}"
