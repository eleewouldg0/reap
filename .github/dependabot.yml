version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/src/python-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/node-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
